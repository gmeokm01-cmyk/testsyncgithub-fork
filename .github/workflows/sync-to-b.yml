name: Mirror Repo A to Repo B

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Repo B as mirror remote
        run: |
          git remote add mirror https://x-access-token:${{ secrets.GH_TOKEN_B }}@github.com/gmeokm01-cmyk/testsyncgithub-fork.git

      - name: Push mirror
        run: |
          git push --mirror mirror
