name: Sync Repo B

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Repo B
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN_B }}@github.com/gmeokm01-cmyk/testsyncgithub-fork.git repoB

      - name: Copy files
        run: |
          rsync -av --delete \
            --exclude='.git' \
            ./ repoB/

      - name: Commit and Push
        run: |
          cd repoB

          git config user.name "gmeokm01-cmyk"
          git config user.email "gmeokm01@gmail.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Sync from Repo A"

          git push origin main
